<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title description">
<title id="title">Testing a 2% gacha rate with 300 pulls</title><desc id="description">Bars show the probability of exactly k copies under 300 independent pulls at a constant 2% rate. Labels above bars are lower-tail p-values: the probability of k or fewer copies. Zero and one copies pass a prespecified p below 0.05 threshold; two copies do not. Only zero through twelve copies are displayed; 0.82% of probability lies beyond the displayed range.</desc>
<rect width="1080" height="650" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif" fill="#17212b">
<text x="32" y="42" font-size="26" font-weight="600">Testing the advertised 2% gacha rate</text><text x="32" y="73" font-size="17">300 independent pulls · constant probability · no pity or guarantees</text>
<text x="32" y="110" font-size="17">Bar height: probability of exactly this many copies.</text><text x="32" y="137" font-size="17">Label above each bar: p-value = probability of this many copies or fewer.</text>
<line x1="78" x2="1052" y1="490" y2="490" stroke="#e0e5ea"/><text x="66" y="495" text-anchor="end" font-size="16">0%</text>
<line x1="78" x2="1052" y1="410" y2="410" stroke="#e0e5ea"/><text x="66" y="415" text-anchor="end" font-size="16">5%</text>
<line x1="78" x2="1052" y1="330" y2="330" stroke="#e0e5ea"/><text x="66" y="335" text-anchor="end" font-size="16">10%</text>
<line x1="78" x2="1052" y1="250" y2="250" stroke="#e0e5ea"/><text x="66" y="255" text-anchor="end" font-size="16">15%</text>
<line x1="78" x2="1052" y1="170" y2="170" stroke="#e0e5ea"/><text x="66" y="175" text-anchor="end" font-size="16">20%</text>
<text transform="translate(22 330) rotate(-90)" text-anchor="middle" font-size="17">Probability of exact count</text>
