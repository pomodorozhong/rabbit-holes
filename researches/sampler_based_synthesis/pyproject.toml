[project]
name = "sampler-based-synthesis"
version = "0.1.0"
description = "Progressive Jupyter notebooks on sampler-based synthesis: waveforms, pitch, envelopes, FX, and a mini sampler"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "ipython>=9.0.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "scipy>=1.16.0",
]
