<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title description">
<title id="title">Git Flow: a hotfix while version 1.5 is being tested</title>
<desc id="description">Time runs left to right. The export feature branches from develop and merges back. release/1.5 is cut from develop and a build goes to testers. A hotfix starts at the v1.4.0 tag on master, then merges into master as v1.4.1 and into release/1.5. When 1.5 is ready, release/1.5 merges into master as v1.5.0 and back into develop.</desc>
<defs>
<marker id="a-hotfix" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c2410c"/></marker>
<marker id="a-release" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker>
<marker id="a-feature" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0f766e"/></marker>
</defs>
<rect x="1" y="1" width="998" height="468" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="21" font-weight="700" fill="#17233a">Git Flow: a hotfix while 1.5 is being tested</text>
<text x="28" y="62" font-size="14" fill="#526176">Time runs left to right. Each arrow shows where a branch’s changes go.</text>

<g font-size="15" font-weight="700">
<text x="28" y="125" fill="#17233a">master</text>
<text x="28" y="195" fill="#c2410c">hotfix/missing-row</text>
<text x="28" y="265" fill="#7c3aed">release/1.5</text>
<text x="28" y="335" fill="#2563eb">develop</text>
<text x="28" y="405" fill="#0f766e">feature/csv-export</text>
</g>
<g stroke="#e2e8f0" stroke-width="1.5">
<path d="M190 190H970"/><path d="M190 260H970"/><path d="M190 400H970"/>
</g>

<path d="M190 120H970" stroke="#17233a" stroke-width="4" fill="none"/>
<path d="M190 330H970" stroke="#2563eb" stroke-width="4" fill="none"/>

<g fill="none" stroke-width="3">
<path d="M270 330C290 330 290 400 320 400H400" stroke="#0f766e"/>
<path d="M400 400C425 400 425 330 448 330" stroke="#0f766e" marker-end="url(#a-feature)"/>
<path d="M500 330C520 330 520 260 545 260H780" stroke="#7c3aed"/>
<path d="M240 120C260 120 260 190 290 190H590" stroke="#c2410c"/>
<path d="M590 190C615 190 610 120 630 120" stroke="#c2410c" marker-end="url(#a-hotfix)"/>
<path d="M590 190C615 190 610 260 630 260" stroke="#c2410c" marker-end="url(#a-hotfix)"/>
<path d="M780 260C815 260 815 120 850 120" stroke="#7c3aed" marker-end="url(#a-release)"/>
<path d="M780 260C815 260 815 330 850 330" stroke="#7c3aed" marker-end="url(#a-release)"/>
</g>

<g stroke="#ffffff" stroke-width="2">
<circle cx="240" cy="120" r="8" fill="#17233a"/>
<circle cx="640" cy="120" r="8" fill="#17233a"/>
<circle cx="860" cy="120" r="8" fill="#17233a"/>
<circle cx="540" cy="190" r="8" fill="#c2410c"/>
<circle cx="575" cy="260" r="8" fill="#7c3aed"/>
<circle cx="640" cy="260" r="8" fill="#7c3aed"/>
<circle cx="780" cy="260" r="8" fill="#7c3aed"/>
<circle cx="270" cy="330" r="8" fill="#2563eb"/>
<circle cx="458" cy="330" r="8" fill="#2563eb"/>
<circle cx="500" cy="330" r="8" fill="#2563eb"/>
<circle cx="860" cy="330" r="8" fill="#2563eb"/>
<circle cx="350" cy="400" r="8" fill="#0f766e"/>
</g>

<g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
<rect x="208" y="84" width="64" height="23" rx="11" fill="#17233a"/><text x="240" y="100">v1.4.0</text>
<rect x="608" y="84" width="64" height="23" rx="11" fill="#17233a"/><text x="640" y="100">v1.4.1</text>
<rect x="828" y="84" width="64" height="23" rx="11" fill="#17233a"/><text x="860" y="100">v1.5.0</text>
</g>

<g font-size="13.5" fill="#334155" text-anchor="middle">
<text x="350" y="430">export is reviewed</text>
<text x="500" y="358">cut the release</text>
<text x="440" y="178">fix the missing row, starting from 1.4</text>
<text x="575" y="288">build for testers</text>
<text x="700" y="288">fix reaches 1.5</text>
<text x="738" y="247">1.5 is ready</text>
<text x="860" y="358">stabilization fixes return</text>
</g>
</g>
</svg>
