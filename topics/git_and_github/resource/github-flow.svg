<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title description">
<title id="title">GitHub Flow: the same fix with export behind a flag</title>
<desc id="description">Time runs left to right. feature/csv-export branches from main, passes review and checks, and merges into main, which deploys with export off. fix/missing-row then branches from main, passes review and checks, merges, and deploys.</desc>
<defs>
<marker id="b-feature" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0f766e"/></marker>
<marker id="b-fix" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c2410c"/></marker>
</defs>
<rect x="1" y="1" width="998" height="348" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="21" font-weight="700" fill="#17233a">GitHub Flow: the same fix, with export behind a flag</text>
<text x="28" y="62" font-size="14" fill="#526176">Time runs left to right. Each arrow shows where a branch’s changes go.</text>

<g font-size="15" font-weight="700">
<text x="28" y="135" fill="#17233a">main</text>
<text x="28" y="225" fill="#0f766e">feature/csv-export</text>
<text x="28" y="295" fill="#c2410c">fix/missing-row</text>
</g>
<g stroke="#e2e8f0" stroke-width="1.5">
<path d="M190 220H970"/><path d="M190 290H970"/>
</g>

<path d="M190 130H970" stroke="#17233a" stroke-width="4" fill="none"/>

<g fill="none" stroke-width="3">
<path d="M240 130C260 130 260 220 290 220H420" stroke="#0f766e"/>
<path d="M420 220C445 220 440 130 460 130" stroke="#0f766e" marker-end="url(#b-feature)"/>
<path d="M470 130C490 130 490 290 520 290H670" stroke="#c2410c"/>
<path d="M670 290C695 290 690 130 710 130" stroke="#c2410c" marker-end="url(#b-fix)"/>
</g>

<g stroke="#ffffff" stroke-width="2">
<circle cx="240" cy="130" r="8" fill="#17233a"/>
<circle cx="470" cy="130" r="8" fill="#17233a"/>
<circle cx="720" cy="130" r="8" fill="#17233a"/>
</g>

<g font-size="13" text-anchor="middle">
<rect x="287" y="207" width="118" height="26" rx="6" fill="#ecfdf5" stroke="#0f766e"/><text x="346" y="225" fill="#134e4a">review + checks</text>
<rect x="536" y="277" width="118" height="26" rx="6" fill="#fff7ed" stroke="#c2410c"/><text x="595" y="295" fill="#7c2d12">review + checks</text>
</g>

<g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
<rect x="398" y="93" width="144" height="23" rx="11" fill="#17233a"/><text x="470" y="109">deploy, export off</text>
<rect x="656" y="93" width="128" height="23" rx="11" fill="#17233a"/><text x="720" y="109">deploy the fix</text>
</g>
</g>
</svg>
